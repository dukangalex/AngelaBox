name: Build ChainBox APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub release"
        required: false
        default: "false"
        type: string
      version_tag:
        description: "Release tag (e.g. v1.0.3)"
        required: false
        default: "v0.0.0-test"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout ChainBox app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sing-box-for-android

      - name: Checkout Chain sing-box kernel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: chain-dev
          path: sing-box
          fetch-depth: 0

      - name: Record kernel identity
        working-directory: sing-box
        run: |
          set -euo pipefail
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "KERNEL_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "KERNEL_DESCRIBE=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Verify official types present in chain-dev
        run: |
          set -euo pipefail
          UPSTREAM=$(grep '^KERNEL_UPSTREAM=' sing-box-for-android/version.properties | cut -d= -f2 | tr -d '\r')
          test -n "$UPSTREAM"
          git clone --depth 1 --branch "v${UPSTREAM}" https://github.com/SagerNet/sing-box.git sing-box-official
          python3 sing-box-for-android/scripts/check_upstream_features.py \
            --official sing-box-official \
            --fork sing-box
          echo "OFFICIAL_FEATURE_CHECK=pass" >> "$GITHUB_ENV"
          echo "KERNEL_UPSTREAM_TAG=v${UPSTREAM}" >> "$GITHUB_ENV"

      - name: Setup Java 17 and 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          # Last version becomes JAVA_HOME (Gradle / AGP 9.1.1).
          # JDK 17 is also installed because sing-box build_libbox
          # hard-requires `openjdk 17`.
          java-version: |
            17
            21

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          # Must match the kernel's own go.mod (dukangalex/sing-box@chain-dev
          # currently declares `go 1.25.5`). experimental/libbox/internal/
          # oomprofile uses go:linkname into unexported runtime/pprof
          # internals, which are not a stable ABI across Go versions — a
          # newer toolchain here breaks that link with "invalid reference to
          # runtime/pprof.parseProcSelfMaps" and fails the whole build.
          go-version: "1.25.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Accept licenses and install NDK 28
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-37.1" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Test Chain sing-box kernel
        working-directory: sing-box
        run: |
          set -euo pipefail
          # Match CI: libbox/boxdd cannot be tested here because oomprofile
          # go:linkname's into unexported runtime/pprof.parseProcSelfMaps.
          # common/netns tests need CAP_SYS_ADMIN (sudo).
          packages=$(go list ./... | grep -v '^github.com/sagernet/sing-box/experimental/boxdd$' | grep -v '^github.com/sagernet/sing-box/experimental/libbox$')
          sudo -E go test $packages
          # sudo leaves GOPATH/GOCACHE owned by root; restore so later
          # `go install` / gomobile / build_libbox can write the module cache.
          sudo chown -R "$(id -u):$(id -g)" "$(go env GOPATH)" "$(go env GOCACHE)" "$(go env GOMODCACHE)"

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init || true

      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -e
          export JAVA_HOME="${JAVA_HOME_17_X64:?JAVA_HOME_17_X64 not set}"
          export PATH="$JAVA_HOME/bin:$(go env GOPATH)/bin:$PATH"
          java --version
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          go run ./cmd/internal/build_libbox -target android -platform android/arm64 -debug

          # 1. 确保目标目录存在
          mkdir -p ../sing-box-for-android/app/libs

          # 2. 如果当前目录下没找到，去外层找找看（防止生成路径偏差）
          if [ ! -f libbox.aar ] && [ -f ../libbox.aar ]; then
            cp -f ../libbox.aar ./libbox.aar
          fi

          # 3. 复制到目标目录，并加上防错处理（即使非关键文件缺失也不中断退出）
          cp -f libbox.aar ../sing-box-for-android/app/libs/ || true
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/
          else
            cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar || true
          fi

      - name: Upload libbox
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libbox-aar
          path: sing-box-for-android/app/libs/*.aar

      - name: Setup release keystore
        working-directory: sing-box-for-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret; build debug APK"
            exit 0
          fi
          STORE_PASS="${KEYSTORE_PASS:-$KEYSTORE_PASSWORD}"
          ALIAS="${ALIAS_NAME:-$KEY_ALIAS}"
          KEY_PASS="${ALIAS_PASS:-$KEY_PASSWORD}"
          test -n "$STORE_PASS" && test -n "$ALIAS" && test -n "$KEY_PASS"
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PASS=$STORE_PASS"
            echo "ALIAS_NAME=$ALIAS"
            echo "ALIAS_PASS=$KEY_PASS"
          } >> local.properties
          echo "Release keystore configured"

      - name: Ensure debug keystore
        working-directory: sing-box-for-android
        run: |
          set -e
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble APKs
        id: assemble
        working-directory: sing-box-for-android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -f app/release.keystore ] && grep -q '^KEYSTORE_PASS=.' local.properties 2>/dev/null; then
            TASK=":app:assembleOtherRelease"
          else
            TASK=":app:assembleOtherDebug"
          fi
          echo "Building $TASK"
          ./gradlew $TASK \
            -x lint -x lintDebug -x lintRelease -x detekt -x spotlessCheck -x spotlessKotlin \
            --stacktrace --no-daemon 2>&1 | tee /tmp/gradle-assemble.log

      - name: Upload gradle log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gradle-log
          path: /tmp/gradle-assemble.log
          if-no-files-found: ignore

      - name: Collect APKs
        if: success()
        run: |
          set -e
          mkdir -p dist
          find sing-box-for-android -type f -name "*.apk" -exec cp -v {} dist/ \;
          PREFERRED=$(ls dist/*arm64-v8a*.apk 2>/dev/null | grep -v debug | head -n1 || true)
          if [ -z "$PREFERRED" ]; then PREFERRED=$(ls dist/*arm64-v8a*.apk 2>/dev/null | head -n1 || true); fi
          if [ -z "$PREFERRED" ]; then PREFERRED=$(ls dist/*.apk | head -n1); fi
          cp -f "$PREFERRED" dist/AngelaBox-android.apk
          sha256sum dist/AngelaBox-android.apk | tee dist/AngelaBox-android.apk.sha256
          ls -lah dist

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChainBox-apk
          path: |
            dist/AngelaBox-android.apk
            dist/AngelaBox-android.apk.sha256
          if-no-files-found: error

      - name: Build release notes
        if: success() && github.event_name == 'workflow_dispatch' && (inputs.publish_release == 'true' || inputs.publish_release == true)
        run: |
          set -euo pipefail
          NOTES="sing-box-for-android/docs/RELEASE_NOTES.md"
          {
            if [ -f "$NOTES" ]; then cat "$NOTES"; echo; fi
            echo "Install \`AngelaBox-android.apk\` (arm64). That is the only file you need."
            echo
            echo "Verify:"
            echo
            echo '```'
            echo "sha256sum -c AngelaBox-android.apk.sha256"
            echo '```'
            echo
            echo "- Product: AngelaBox"
            echo "- Package: \`io.chainbox.app\`"
            echo "- Kernel branch: \`chain-dev\`"
            echo "- Kernel tag: \`${KERNEL_DESCRIBE}\`"
            echo "- Kernel commit: \`${KERNEL_COMMIT}\`"
            echo "- Official baseline: SagerNet/sing-box \`${KERNEL_UPSTREAM_TAG}\`"
            echo "- Official type-constant check: \`${OFFICIAL_FEATURE_CHECK}\`"
          } > release-body.md

      - name: Publish GitHub Release
        if: success() && github.event_name == 'workflow_dispatch' && (inputs.publish_release == 'true' || inputs.publish_release == true)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.version_tag }}
          name: AngelaBox ${{ inputs.version_tag }}
          body_path: release-body.md
          files: |
            dist/AngelaBox-android.apk
            dist/AngelaBox-android.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Telegram channel
        if: success() && github.event_name == 'workflow_dispatch' && (inputs.publish_release == 'true' || inputs.publish_release == true)
        continue-on-error: true
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          VERSION_TAG: ${{ inputs.version_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHANNEL_ID:-}" ]; then
            echo "::warning::Set repo secrets TG_BOT_TOKEN and TG_CHANNEL_ID=@AngelaBox so releases post to https://t.me/AngelaBox"
            exit 0
          fi
          ROOT="${GITHUB_WORKSPACE:-.}"
          cd "$ROOT"
          APK="${ROOT}/dist/AngelaBox-android.apk"
          if [ ! -f "$APK" ]; then
            APK="$(find "$ROOT" -type f -name 'AngelaBox-android.apk' -size +1M | head -n1 || true)"
          fi
          SHA_FILE="${ROOT}/dist/AngelaBox-android.apk.sha256"
          if [ ! -f "$SHA_FILE" ]; then
            SHA_FILE="$(find "$ROOT" -type f -name 'AngelaBox-android.apk.sha256' | head -n1 || true)"
          fi
          SHA=""
          if [ -n "${SHA_FILE}" ] && [ -f "${SHA_FILE}" ]; then SHA="$(awk '{print $1}' "$SHA_FILE")"; fi
          URL="https://github.com/dukangalex/AngelaBox/releases/tag/${VERSION_TAG}"
          APK_URL="https://github.com/dukangalex/AngelaBox/releases/download/${VERSION_TAG}/AngelaBox-android.apk"
          TAG="${VERSION_TAG}" RELEASE_URL="${URL}" SHA256="${SHA}" APK_URL="${APK_URL}" \
            NOTES_FILE="${ROOT}/sing-box-for-android/docs/RELEASE_NOTES.md" \
            python3 "${ROOT}/sing-box-for-android/scripts/telegram_announce.py"
          if [ -n "${APK}" ] && [ -f "${APK}" ]; then
            ls -lh "$APK"
            echo "Telegram upload path: ${APK}"
            APK_FILE="${APK}" python3 "${ROOT}/sing-box-for-android/scripts/telegram_send.py"
          else
            echo "::warning::AngelaBox-android.apk not found for Telegram upload"
            find "$ROOT" -name '*.apk' | head
            SKIP_DOCUMENT=true python3 "${ROOT}/sing-box-for-android/scripts/telegram_send.py"
          fi
