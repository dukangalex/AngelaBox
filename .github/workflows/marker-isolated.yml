name: Isolated marker cleanup regression
on:
  push:
    branches: [validation/marker-cleanup-ci-20261121]
permissions:
  contents: read
  actions: read
jobs:
  marker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK and exact prior candidate AAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dukangalex/AngelaBox
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          "$SDKMANAGER" --install "platforms;android-37.1" "build-tools;35.0.0" "platform-tools"
          echo "sdk.dir=$SDK" > local.properties
          gh run download 44847859616 -n native-candidate-arm64-api24 -D candidate-native
          echo '18a3f23bd67db96c9d8f3419ad4b92b3673a7f00cb47cfcb4ddd93a171ed807b  candidate-native/libbox-native-close-arm64-api24.aar' | sha256sum -c -
          mkdir -p app/libs
          cp candidate-native/libbox-native-close-arm64-api24.aar app/libs/libbox.aar
      - name: Run marker and creation integration regressions
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4096m \
            --tests io.nekohasekai.sfa.utils.ProfilePathReservationTest \
            --tests io.nekohasekai.sfa.utils.ProfileCreationIntegrationTest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marker-isolated-test-results
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
