name: Temporary Hysteria TCP duration comparison
on:
  push:
    branches: [wabi/hy-tcp-duration-diagnosis]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: 3ae0e4b7a3d857592ced6783d248bcd425be335a
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
      - name: Compare normal and root candidate TCP with diagnostic deadline
        run: |
          set -uo pipefail
          for mode in normal root; do
            sha=3ae0e4b7a3d857592ced6783d248bcd425be335a
            for deadline in 10 60; do
              git reset --hard "$sha" || exit 1
              cd test || exit 1
              echo "=== ref=$sha mode=$mode diagnostic_timeout=${deadline}s TCP_ONLY ===" | tee -a /tmp/hy-tcp-compare.log
              python3 - "$deadline" <<'PY'
          import pathlib,sys
          p=pathlib.Path('clash_test.go')
          s=p.read_text(); a=s.index('func newLargeDataPair('); b=s.index('\nfunc ',a+5)
          section=s[a:b]; old='case <-time.After(10 * time.Second):'; assert old in section
          section=section.replace(old,'case <-time.After('+sys.argv[1]+' * time.Second):')
          p.write_text(s[:a]+section+s[b:])
          p=pathlib.Path('box_test.go'); s=p.read_text()
          for name in ('testSuit','testSuitLargeUDP'):
              start=s.index('func '+name+'('); end=s.index('\nfunc ',start+5)
              section=s[start:end]
              section='\n'.join(line for line in section.split('\n') if not ('require.NoError' in line and ('PacketConn' in line)))
              i=section.rfind('}'); section=section[:i]+'\t_ = dialUDP\n'+section[i:]
              s=s[:start]+section+s[end:]
          p.write_text(s)
          PY
              start=$(date +%s)
              prefix=(); if [ "$mode" = root ]; then prefix=(sudo -E env -u GITHUB_TOKEN -u GH_TOKEN); fi
              set +e
              "${prefix[@]}" go test -mod=mod -count=1 -v -timeout 5m -ldflags='-checklinkname=0' -tags 'badlinkname,with_quic,with_utls,with_wireguard,with_clash_api,with_gvisor,with_openvpn' -run '^TestHysteria(Self|Inbound|Outbound)$|^TestHysteria2Self/self$' . 2>&1 | tee -a /tmp/hy-tcp-compare.log
              rc=${PIPESTATUS[0]}; echo "=== ref=$sha mode=$mode diagnostic_timeout=$deadline rc=$rc elapsed=$(($(date +%s)-start))s ===" | tee -a /tmp/hy-tcp-compare.log
              cd .. || exit 1
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hy-tcp-duration-compare
          path: /tmp/hy-tcp-compare.log
          retention-days: 7
