name: Temporary Linux Hysteria size comparison
on:
  push:
    branches: [wabi/linux-diagnostics-20261030]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: app
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: e086d9de7653adba08133ecb6257b40370b0f20c
          path: kernel
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
      - run: docker pull tobyxdd/hysteria:v1.3.5
      - name: Compare baseline and candidate Hysteria UDP packet sizes
        working-directory: kernel/test
        run: |
          set +e
          run_tests() {
            local flavor="$1" size="$2"
            cp clash_test.go /tmp/wabi-original-clash-test.go
            sed -i 's/time.After(10 \* time.Second)/time.After(60 * time.Second)/g' clash_test.go
            if [ "$size" = 1100 ]; then
              sed -i 's/testLargeDataWithPacketConnSize(t, port, 1500, pcc)/testLargeDataWithPacketConnSize(t, port, 1100, pcc)/' clash_test.go
            fi
            echo "=== $flavor UDP size $size ==="
            go test -mod=mod -count=1 -v -timeout 5m -ldflags='-checklinkname=0' -tags 'badlinkname,with_quic,with_utls,with_wireguard,with_clash_api,with_gvisor' -run '^(TestHysteriaSelf|TestHysteriaInbound|TestHysteriaOutbound)$' .
            echo "DIAGNOSTIC_EXIT $flavor $size $?"
            cp /tmp/wabi-original-clash-test.go clash_test.go
          }
          # The released tag has conflict markers in test/go.mod and test/go.sum.
          # Normalize only the test harness with the candidate's resolved modules;
          # the baseline kernel source itself stays at the released commit.
          cd ..
          git apply --check ../app/.wabi-evidence/candidate.patch || exit 2
          git apply ../app/.wabi-evidence/candidate.patch || exit 3
          cp test/go.mod /tmp/wabi-test-go.mod
          cp test/go.sum /tmp/wabi-test-go.sum
          git reset --hard HEAD
          cp /tmp/wabi-test-go.mod test/go.mod
          cp /tmp/wabi-test-go.sum test/go.sum
          cd test
          go list -mod=mod -m all > /tmp/baseline-modules.txt || exit 4
          run_tests baseline 1500
          run_tests baseline 1100
          cd ..
          git reset --hard HEAD
          git apply --check ../app/.wabi-evidence/candidate.patch || exit 5
          git apply ../app/.wabi-evidence/candidate.patch || exit 6
          cd test
          go list -mod=mod -m all > /tmp/candidate-modules.txt || exit 7
          echo '=== effective module differences ==='
          diff -u /tmp/baseline-modules.txt /tmp/candidate-modules.txt || true
          run_tests candidate 1500
          run_tests candidate 1100
