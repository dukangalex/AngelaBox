name: Temporary Hysteria v1 compatibility verification
on:
  push:
    branches: [wabi/hysteria-v1-compat-verify]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: app
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: e086d9de7653adba08133ecb6257b40370b0f20c
          path: kernel
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.5'
      - name: Apply candidate and exact compatibility patch
        working-directory: kernel
        run: |
          set -euo pipefail
          git apply --check ../app/.wabi-evidence/candidate.patch
          git apply ../app/.wabi-evidence/candidate.patch
          cd test
          go mod download github.com/sagernet/sing-quic
          MOD_VERSION="$(go list -mod=mod -m -f '{{.Version}}' github.com/sagernet/sing-quic)"
          test "$MOD_VERSION" = 'v0.7.2-0.20261020082049-7e0a5869a5f4'
          MODULE_DIR="$(go list -mod=mod -m -f '{{.Dir}}' github.com/sagernet/sing-quic)"
          cp -r "$MODULE_DIR" /tmp/wabi-sing-quic-compat
          chmod -R u+w /tmp/wabi-sing-quic-compat
          cd /tmp/wabi-sing-quic-compat
          sha256sum "$GITHUB_WORKSPACE/app/.wabi-evidence/hysteria-v1-bidirectional-1200.patch"
          git apply --check "$GITHUB_WORKSPACE/app/.wabi-evidence/hysteria-v1-bidirectional-1200.patch"
          git apply "$GITHUB_WORKSPACE/app/.wabi-evidence/hysteria-v1-bidirectional-1200.patch"
          cd "$GITHUB_WORKSPACE/kernel/test"
          go mod edit -replace github.com/sagernet/sing-quic=/tmp/wabi-sing-quic-compat
          cp clash_test.go /tmp/wabi-original-clash-test.go
          cp box_test.go /tmp/wabi-original-box-test.go
          cp hysteria_test.go /tmp/wabi-original-hysteria-test.go
          rc=0
          for size in 1500 1100; do
            cp /tmp/wabi-original-clash-test.go clash_test.go
            cp /tmp/wabi-original-hysteria-test.go hysteria_test.go
            # Diagnose datagrams independently of the preceding 6.4 MiB TCP transfer.
            sed -i '/require.NoError(t, testLargeDataWithConn(t, testPort, dialTCP))/d' box_test.go
            sed -i 's/testSuitSimple1(t, clientPort, testPort)/testSuit(t, clientPort, testPort)/' hysteria_test.go
            if [ "$size" = 1100 ]; then sed -i 's/testLargeDataWithPacketConnSize(t, port, 1500, pcc)/testLargeDataWithPacketConnSize(t, port, 1100, pcc)/' clash_test.go; fi
            echo "=== Hysteria v1 UDP $size ==="
            go test -mod=mod -count=1 -v -timeout 8m -ldflags='-checklinkname=0' -tags 'badlinkname,with_quic,with_utls,with_wireguard,with_clash_api,with_gvisor' -run '^TestHysteria(Self|Inbound|Outbound)$' . 2>&1 | tee "/tmp/compat-${size}.log" || rc=1
          done
          cp /tmp/wabi-original-clash-test.go clash_test.go
          cp /tmp/wabi-original-box-test.go box_test.go
          cp /tmp/wabi-original-hysteria-test.go hysteria_test.go
          # Measure the previously timed-out TCP path with a longer explicit limit.
          sed -i 's/time.After(10 \* time.Second)/time.After(60 * time.Second)/g' clash_test.go
          echo '=== Hysteria v1 original suite with 60s transfer timeout ==='
          go test -mod=mod -count=1 -v -timeout 10m -ldflags='-checklinkname=0' -tags 'badlinkname,with_quic,with_utls,with_wireguard,with_clash_api,with_gvisor' -run '^TestHysteria(Self|Inbound|Outbound)$' . 2>&1 | tee /tmp/compat-v1-full.log || rc=1
          echo '=== Hysteria2 bidirectional regression ==='
          go test -mod=mod -count=1 -v -timeout 8m -ldflags='-checklinkname=0' -tags 'badlinkname,with_quic,with_utls,with_wireguard,with_clash_api,with_gvisor' -run '^TestHysteria2(Self|Inbound|Outbound)$' . 2>&1 | tee /tmp/compat-hysteria2.log || rc=1
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hysteria-v1-compatibility-logs
          path: /tmp/compat-*.log
          if-no-files-found: ignore
          retention-days: 7
