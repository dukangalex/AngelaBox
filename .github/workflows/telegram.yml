name: Telegram Release
run-name: Telegram ${{ inputs.tag || github.event.release.tag_name || 'latest' }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (empty = latest published release)"
        required: false
        default: ""
      document_only:
        description: "true = only upload the APK document (skip the text message)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  telegram-release:
    name: Publish Release to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Check Telegram secrets
        id: creds
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHANNEL_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Set repo secrets TG_BOT_TOKEN and TG_CHANNEL_ID (@AngelaBox) to enable channel notify."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release
        id: release
        if: steps.creds.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME_FIELD: ${{ github.event.release.name }}
          EVENT_URL: ${{ github.event.release.html_url }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "release" ]; then
            TAG="${EVENT_TAG}"
            NAME="${EVENT_NAME_FIELD}"
            URL="${EVENT_URL}"
          else
            if [ -n "${INPUT_TAG}" ]; then
              API_URL="${GITHUB_API_URL}/repos/${REPO}/releases/tags/${INPUT_TAG}"
            else
              API_URL="${GITHUB_API_URL}/repos/${REPO}/releases/latest"
            fi
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}" > resolved-release.json
            TAG="$(jq -r '.tag_name' resolved-release.json)"
            NAME="$(jq -r '.name' resolved-release.json)"
            URL="$(jq -r '.html_url' resolved-release.json)"
            test -n "${TAG}" && test "${TAG}" != "null"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Find release assets
        id: assets
        if: steps.creds.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          API_URL="${GITHUB_API_URL}/repos/${REPO}/releases/tags/${TAG}"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}" > release.json
          APK_URL="$(jq -r '.assets[] | select(.name == "AngelaBox-android.apk") | .browser_download_url' release.json | head -n1)"
          SHA_URL="$(jq -r '.assets[] | select(.name == "AngelaBox-android.apk.sha256") | .browser_download_url' release.json | head -n1)"
          jq -r '.body // ""' release.json > release-body.txt
          if [ -z "${APK_URL}" ] || [ "${APK_URL}" = "null" ]; then
            echo "::error::AngelaBox-android.apk was not found in the release."
            jq -r '.assets[].name' release.json
            exit 1
          fi
          if [ -z "${SHA_URL}" ] || [ "${SHA_URL}" = "null" ]; then
            echo "::error::AngelaBox-android.apk.sha256 was not found in the release."
            exit 1
          fi
          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "sha_url=${SHA_URL}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        if: steps.creds.outputs.configured == 'true'
        env:
          APK_URL: ${{ steps.assets.outputs.apk_url }}
          SHA_URL: ${{ steps.assets.outputs.sha_url }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "${APK_URL}" -o AngelaBox-android.apk
          curl -fL --retry 3 --retry-delay 2 "${SHA_URL}" -o AngelaBox-android.apk.sha256
          test -s AngelaBox-android.apk
          test -s AngelaBox-android.apk.sha256
          ls -lh AngelaBox-android.apk

      - name: Verify APK checksum
        id: checksum
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          EXPECTED="$(awk '{print $1}' AngelaBox-android.apk.sha256)"
          ACTUAL="$(sha256sum AngelaBox-android.apk | awk '{print $1}')"
          echo "expected=${EXPECTED}"
          echo "actual=${ACTUAL}"
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::SHA256 verification failed."
            exit 1
          fi
          echo "sha256=${ACTUAL}" >> "$GITHUB_OUTPUT"

      - name: Build Telegram message
        if: steps.creds.outputs.configured == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          APK_URL: ${{ steps.assets.outputs.apk_url }}
        run: |
          set -euo pipefail
          python3 scripts/telegram_announce.py

      - name: Send to Telegram
        if: steps.creds.outputs.configured == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          APK_FILE: AngelaBox-android.apk
          DOCUMENT_ONLY: ${{ github.event.inputs.document_only }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          ls -lh AngelaBox-android.apk
          python3 scripts/telegram_send.py

      - name: Complete
        run: |
          if [ "${{ steps.creds.outputs.configured }}" = "true" ]; then
            echo "Telegram release publication completed: ${{ steps.release.outputs.tag }}"
          else
            echo "Skipped Telegram notify (secrets TG_BOT_TOKEN / TG_CHANNEL_ID not set)"
          fi
