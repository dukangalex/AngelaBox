name: Candidate translated ARM64 runtime smoke
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
  actions: read
jobs:
  translated-arm64-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - name: Wait for exact security-candidate build and download APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dukangalex/AngelaBox
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          RUN_ID=""
          for attempt in $(seq 1 20); do
            RUN_ID=$(gh run list --workflow native-candidate.yml --event pull_request --limit 100 --json databaseId,headSha --jq ".[] | select(.headSha == \"$EXPECTED_SHA\") | .databaseId" | head -1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 3
          done
          test -n "$RUN_ID"
          gh run watch "$RUN_ID" --exit-status
          test "$(gh run view "$RUN_ID" --json headSha --jq .headSha)" = "$EXPECTED_SHA"
          gh run download "$RUN_ID" -n candidate-emulator-only-apk -D apk
          gh run view "$RUN_ID" --json databaseId,headSha,status,conclusion > build-provenance.json
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android 30 Google APIs image with ARM64 translation
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          "$SDKMANAGER" --install emulator platform-tools 'system-images;android-30;google_apis;x86_64' 'build-tools;35.0.0'
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd-home"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "$AVDMANAGER" create avd -n native-smoke --package 'system-images;android-30;google_apis;x86_64' --device pixel --path "$ANDROID_AVD_HOME/native-smoke.avd"
          test -f "$ANDROID_AVD_HOME/native-smoke.ini"
          "$SDK/emulator/emulator" -list-avds | grep -Fx native-smoke
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Boot, install and launch exact ARM64 candidate
        run: |
          set -euo pipefail
          mkdir -p runtime-evidence
          cp build-provenance.json runtime-evidence/
          APK=$(find apk -name '*.apk' -type f | head -1)
          test -n "$APK"
          sha256sum "$APK" > runtime-evidence/apk-sha256.txt
          "$ANDROID_HOME/emulator/emulator" -avd native-smoke -no-window -no-audio -no-snapshot -no-metrics -gpu swiftshader_indirect > runtime-evidence/emulator.log 2>&1 &
          EMU=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          collect_runtime_evidence() {
            result=$?
            trap - EXIT
            "$ADB" logcat -d > runtime-evidence/logcat.txt 2>&1 || true
            "$ADB" shell dumpsys activity activities > runtime-evidence/activities.txt 2>&1 || true
            "$ADB" shell dumpsys activity exit-info io.chainbox.app > runtime-evidence/exit-info.txt 2>&1 || true
            "$ADB" shell ps -A > runtime-evidence/processes.txt 2>&1 || true
            "$ADB" exec-out screencap -p > runtime-evidence/startup.png 2>/dev/null || true
            if [ "$result" -ne 0 ]; then
              echo "FAIL: runtime checks stopped with exit $result; see logcat and exit-info." > runtime-evidence/result.txt
              tail -120 runtime-evidence/logcat.txt || true
            fi
            kill "$EMU" 2>/dev/null || true
            exit "$result"
          }
          trap collect_runtime_evidence EXIT
          deadline=$((SECONDS + 240))
          until [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do
            if ! kill -0 "$EMU" 2>/dev/null; then cat runtime-evidence/emulator.log; exit 1; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "emulator boot timeout"; cat runtime-evidence/emulator.log; exit 1; fi
            sleep 2
          done
          "$ADB" shell getprop > runtime-evidence/guest-properties.txt
          "$ADB" shell getprop ro.product.cpu.abilist | grep arm64-v8a
          "$ADB" shell getprop ro.dalvik.vm.native.bridge | grep libndk_translation
          "$ADB" logcat -c
          "$ADB" install "$APK" | tee runtime-evidence/install.txt
          "$ADB" shell monkey -p io.chainbox.app -c android.intent.category.LAUNCHER 1 > runtime-evidence/launch.txt
          sleep 20
          PID=$("$ADB" shell pidof io.chainbox.app | tr -d '\r')
          test -n "$PID"
          "$ADB" shell run-as io.chainbox.app cat "/proc/$PID/maps" > runtime-evidence/process-maps.txt
          grep -E 'libgojni|libbox' runtime-evidence/process-maps.txt
          "$ADB" logcat -d > runtime-evidence/logcat.txt
          ! grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|Fatal signal|panic:' runtime-evidence/logcat.txt
          "$ADB" exec-out screencap -p > runtime-evidence/startup.png
          echo 'PASS: installed, launched, remained alive and mapped candidate Go JNI via ARM64 translation. Not hardware ARM64 or VPN acceptance.' > runtime-evidence/result.txt
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-translated-arm64-runtime
          path: runtime-evidence/
          retention-days: 14
