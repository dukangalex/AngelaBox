name: AngelaBox offline ARM64 emulator probe
on:
  push:
    branches: [wabi/offline-candidate-421532a1-20261114]
permissions:
  contents: read
  actions: read
jobs:
  offline-arm64-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout probe branch without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare official emulator and x86_64 system image with ARM translation
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          printf 'ANDROID_HOME=%s\n' "$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'platform-tools' 'system-images;android-34;google_apis;x86_64'
      - name: Obtain and authenticate exact prior build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download 43551017192 --repo dukangalex/AngelaBox --name angelabox-arm64-debug-candidate --dir "$RUNNER_TEMP/candidate"
          test -f "$RUNNER_TEMP/candidate/angelabox-arm64-debug.apk"
          echo 'dec184878c4ba91b1e11919250b813865552df2d991c92441dda0b54f18dffa7  '"$RUNNER_TEMP/candidate/angelabox-arm64-debug.apk" | sha256sum -c -
      - name: Verify isolation and smoke-test exact APK offline
        run: |
          set -euo pipefail
          echo "HOSTED_CPU_COUNT=$(nproc)"
          test "$(nproc)" -ge 2
          sudo useradd -m -s /bin/bash wabi_trial
          # The sandbox account needs KVM for the x86_64 emulator; no host-wide mode change.
          test -c /dev/kvm
          KVM_GROUP="$(stat -c %G /dev/kvm)"
          getent group "$KVM_GROUP" >/dev/null
          sudo usermod -aG "$KVM_GROUP" wabi_trial
          sudo -u wabi_trial test -r /dev/kvm
          sudo -u wabi_trial test -w /dev/kvm
          sudo install -m 0755 .github/scripts/android-offline-check.sh /home/wabi_trial/check.sh
          sudo install -m 0755 .github/scripts/assert-egress-blocked.py /home/wabi_trial/assert-egress-blocked.py
          sudo chown root:root /home/wabi_trial/check.sh /home/wabi_trial/assert-egress-blocked.py
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/candidate/angelabox-arm64-debug.apk" /home/wabi_trial/candidate.apk
          # A dedicated network namespace exposes only its own loopback to adb/emulator.
          # It has no external interfaces or routes; unlike a host-wide UID block, adb can connect.
          sudo unshare --net -- /bin/bash -euo pipefail -c '
            ip link set lo up
            test "$(ip -o link show | cut -d: -f2 | tr -d " ")" = "lo"
            test -z "$(ip -4 route show)"
            test -z "$(ip -6 route show | grep -v "^::1 " || true)"
            runuser -u wabi_trial -- env -i HOME=/home/wabi_trial USER=wabi_trial PATH=/usr/bin:/bin python3 /home/wabi_trial/assert-egress-blocked.py
            exec runuser -u wabi_trial -- env -i HOME=/home/wabi_trial USER=wabi_trial ANDROID_HOME="$1" PATH=/usr/bin:/bin /home/wabi_trial/check.sh
          ' _ "$ANDROID_HOME"
