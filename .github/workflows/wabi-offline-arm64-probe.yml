name: AngelaBox offline ARM64 emulator probe
on:
  push:
    branches: [wabi/arm64-offline-accept-20261113]
permissions:
  contents: read
  actions: read
jobs:
  offline-arm64-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout probe branch without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare official emulator and ARM64 system image
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          printf 'ANDROID_HOME=%s\n' "$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'emulator' 'platform-tools' 'system-images;android-34;google_apis;arm64-v8a'
      - name: Obtain and authenticate exact prior build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          gh run download 43346096702 --repo dukangalex/AngelaBox --name angelabox-arm64-debug-candidate --dir "$RUNNER_TEMP/candidate"
          test -f "$RUNNER_TEMP/candidate/angelabox-arm64-debug.apk"
          echo '2cece47abcd1433f9459c2dc84db79748caf3addc495d900a3c58ef09c902907  '"$RUNNER_TEMP/candidate/angelabox-arm64-debug.apk" | sha256sum -c -
      - name: Verify isolation and smoke-test exact APK offline
        run: |
          set -euo pipefail
          echo "HOSTED_CPU_COUNT=$(nproc)"
          test "$(nproc)" -ge 2
          sudo useradd -m -s /bin/bash wabi_trial
          sudo install -m 0755 .github/scripts/android-offline-check.sh /home/wabi_trial/check.sh
          sudo install -m 0755 .github/scripts/assert-egress-blocked.py /home/wabi_trial/assert-egress-blocked.py
          sudo chown root:root /home/wabi_trial/check.sh /home/wabi_trial/assert-egress-blocked.py
          sudo install -o root -g root -m 0444 "$RUNNER_TEMP/candidate/angelabox-arm64-debug.apk" /home/wabi_trial/candidate.apk
          # Only the unprivileged test UID runs the candidate. These runner-host firewall rules
          # deny every IPv4/IPv6 packet from that UID; fail closed if either rule is unavailable.
          sudo iptables -I OUTPUT 1 -m owner --uid-owner wabi_trial -m comment --comment wabi_trial_ipv4 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner wabi_trial -m comment --comment wabi_trial_ipv6 -j REJECT
          sudo iptables -C OUTPUT -m owner --uid-owner wabi_trial -m comment --comment wabi_trial_ipv4 -j REJECT
          sudo ip6tables -C OUTPUT -m owner --uid-owner wabi_trial -m comment --comment wabi_trial_ipv6 -j REJECT
          v4_before="$(sudo iptables-save -c | grep 'wabi_trial_ipv4')"
          sudo runuser -u wabi_trial -- env -i HOME=/home/wabi_trial USER=wabi_trial PATH=/usr/bin:/bin python3 /home/wabi_trial/assert-egress-blocked.py
          v4_after="$(sudo iptables-save -c | grep 'wabi_trial_ipv4')"
          test "$v4_before" != "$v4_after"
          printf 'EGRESS_BLOCK_RULES_IPV4=%s\nEGRESS_BLOCK_RULES_IPV6=%s\n' "$v4_after" "$(sudo ip6tables-save -c | grep 'wabi_trial_ipv6')"
          exec sudo runuser -u wabi_trial -- env -i HOME=/home/wabi_trial USER=wabi_trial ANDROID_HOME="$ANDROID_HOME" PATH=/usr/bin:/bin /home/wabi_trial/check.sh
