name: PR42 UI public-host update and persistence API34 (non-publishing)
on:
  push:
    branches: [wabi/ui-persistence-acceptance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ChainBox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sing-box-for-android
          fetch-depth: 0

      - name: Validate controlled egress harness
        working-directory: sing-box-for-android
        run: |
          python3 -m py_compile scripts/wabi_subscription_peer.py scripts/wabi_subscription_android.py scripts/wabi_subscription_stream_preflight.py scripts/wabi_ui_persistence_android.py
          python3 -m py_compile scripts/wabi_socks_peer.py
          git diff --exit-code b994dfc02f3dfee97a256167bd3dbfcaaac2b727 -- app/src/main
          mkdir -p wabi-evidence
          git rev-parse HEAD > wabi-evidence/test-source-head.txt
          echo b994dfc02f3dfee97a256167bd3dbfcaaac2b727 > wabi-evidence/product-source-head.txt

      - name: Read kernel pin
        id: pin
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          COMMIT=$(grep '^KERNEL_COMMIT=' version.properties | cut -d= -f2 | tr -d '\r')
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout Chain kernel at audited commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: ${{ steps.pin.outputs.commit }}
          path: sing-box
          fetch-depth: 1

      - name: Verify kernel identity
        working-directory: sing-box
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"

      - name: Setup Java 17 and 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle
          cache-dependency-path: |
            sing-box-for-android/**/*.gradle*
            sing-box-for-android/**/gradle-wrapper.properties
            sing-box-for-android/gradle/libs.versions.toml

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.5"
          cache-dependency-path: sing-box/go.sum

      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          for bin in \
            "$SDK/cmdline-tools/latest/bin" \
            "$SDK/cmdline-tools/current/bin" \
            "$SDK/cmdline-tools/16.0/bin" \
            "$SDK/cmdline-tools/11.0/bin" \
            "$SDK/tools/bin" \
            "$SDK/platform-tools"
          do
            if [ -d "$bin" ]; then
              echo "$bin" >> "$GITHUB_PATH"
              export PATH="$bin:$PATH"
            fi
          done
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager not on PATH; listing $SDK"
            find "$SDK" -maxdepth 4 -name sdkmanager -type f || true
            exit 1
          fi
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          echo "Using Android SDK at $SDK"

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-37.1" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -d "${ANDROID_HOME}/ndk/28.0.13004108"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" version
          "$(go env GOPATH)/bin/gomobile" init || true

      - name: Build libbox AAR
        working-directory: sing-box
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?JAVA_HOME_17_X64 not set}"
          export PATH="$JAVA_HOME/bin:$(go env GOPATH)/bin:$PATH"
          java --version
          export ANDROID_HOME ANDROID_SDK_ROOT ANDROID_NDK_HOME
          go run ./cmd/internal/build_libbox -target android -platform android/amd64 -debug
          mkdir -p ../sing-box-for-android/app/libs
          FOUND=$(find . .. -name 'libbox.aar' -type f 2>/dev/null | head -n1 || true)
          if [ -z "$FOUND" ]; then
            echo "libbox.aar not produced; falling back to gomobile bind"
            TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_low_memory,badlinkname,tfogo_checklinkname0"
            gomobile bind -v -o libbox.aar -target android/amd64 -androidapi 24 \
              -javapkg=io.nekohasekai -libname=box -trimpath -tags "$TAGS" ./experimental/libbox
            FOUND=libbox.aar
          fi
          cp -f "$FOUND" ../sing-box-for-android/app/libs/libbox.aar
          if [ -f libbox-legacy.aar ]; then
            cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/libbox-legacy.aar
          else
            cp -f "$FOUND" ../sing-box-for-android/app/libs/libbox-legacy.aar
          fi
          ls -lah ../sing-box-for-android/app/libs/
          test -s ../sing-box-for-android/app/libs/libbox.aar

      - name: Verify unmodified production transport source
        working-directory: sing-box-for-android
        run: |
          git diff --exit-code b994dfc02f3dfee97a256167bd3dbfcaaac2b727 -- app/src/main
          mkdir -p wabi-evidence
          git rev-parse HEAD > wabi-evidence/test-source-head.txt
          echo b994dfc02f3dfee97a256167bd3dbfcaaac2b727 > wabi-evidence/product-source-head.txt
          mkdir -p wabi-evidence
          git rev-parse HEAD > wabi-evidence/test-source-head.txt
          printf '%s\n' 'b994dfc02f3dfee97a256167bd3dbfcaaac2b727' > wabi-evidence/product-source-head.txt
      - name: Build debug x86_64 APK
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000 -noprompt; fi
          # Test-only ABI override, not a production source change.
          sed -i 's/abiFilters += "arm64-v8a"/abiFilters += "x86_64"/' app/build.gradle.kts
          grep -q 'abiFilters += "x86_64"' app/build.gradle.kts
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ./gradlew :app:testDebugUnitTest --tests '*HTTPClientVpnSubscriptionTest' --tests '*HTTPClientSubscriptionTest' --tests '*HTTPClientRedirectTest' --tests '*RemoteUrlGuardTest' --no-daemon --stacktrace
          find app/build/outputs/apk -name '*.apk' -print
      - name: Release completed build scratch space before emulator
        run: |
          set -euo pipefail
          df -h "$HOME" "$GITHUB_WORKSPACE"
          # Compilation and JVM tests are complete. Retain the APK and test XML;
          # remove rebuildable compiler caches and SDK components no longer needed
          # by the emulator before extracting its large API34 userdata image.
          go clean -cache -modcache
          rm -rf sing-box-for-android/app/build/intermediates \
                 sing-box-for-android/app/build/tmp \
                 sing-box-for-android/app/build/kotlin \
                 sing-box-for-android/.gradle \
                 "$HOME/.gradle/caches" \
                 "$ANDROID_HOME/ndk/28.0.13004108" \
                 "$ANDROID_HOME/platforms/android-37.1" \
                 "$ANDROID_HOME/platforms/android-35" \
                 "$ANDROID_HOME/build-tools/35.0.0"
          df -h "$HOME" "$GITHUB_WORKSPACE"
          available=$(df -PB1 "$HOME" | awk 'NR==2 {print $4}')
          test "$available" -ge 6442450944
      - name: Install emulator and enable KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          yes | sdkmanager --licenses >/dev/null || true
          mkdir -p sing-box-for-android/wabi-evidence
          # SDK mirrors occasionally fail; preserve diagnostics and bound each attempt.
          installed=false
          for attempt in 1 2 3; do
            if timeout 300s sdkmanager 'emulator' 'system-images;android-34;google_apis;x86_64' 2>&1 | tee "sing-box-for-android/wabi-evidence/sdk-install-$attempt.txt"; then
              installed=true
              break
            fi
            sleep 10
          done
          test "$installed" = true
          df -h "$HOME"
          available=$(df -PB1 "$HOME" | awk 'NR==2 {print $4}')
          # The API34 image may materialize a 7.2GiB userdata image even with
          # a smaller AVD override. Ensure it fits before creating/booting AVD.
          test "$available" -ge 8589934592
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | timeout 60s avdmanager create avd -n route34 -p "$HOME/.android/avd/route34.avd" -k 'system-images;android-34;google_apis;x86_64' --force
          # API34 image defaults request a 7.2GiB userdata partition. The finite
          # test installs one APK and stores only screenshots/logs; use a bounded
          # 2GiB userdata disk, preserving disk preflight and all test assertions.
          sed -i '/^disk.dataPartition.size=/d' "$ANDROID_AVD_HOME/route34.avd/config.ini"
          echo 'disk.dataPartition.size=2G' >> "$ANDROID_AVD_HOME/route34.avd/config.ini"
          grep -x 'disk.dataPartition.size=2G' "$ANDROID_AVD_HOME/route34.avd/config.ini"
          df -h "$HOME"
          available=$(df -PB1 "$HOME" | awk 'NR==2 {print $4}')
          test "$available" -ge 3221225472
          echo "ANDROID_AVD_HOME=$HOME/.android/avd" >> "$GITHUB_ENV"
          ls -la "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/wabi-avds.txt
          grep -x route34 /tmp/wabi-avds.txt
      - name: Boot emulator and inspect real app
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd route34 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/emu.log 2>&1 &
          pid=$!
          for i in $(seq 1 120); do
            if ! kill -0 "$pid" 2>/dev/null; then cat /tmp/emu.log; exit 1; fi
            if timeout 5s adb get-state 2>/dev/null | grep -qx device; then break; fi
            sleep 2
          done
          if ! timeout 5s adb get-state | grep -qx device; then cat /tmp/emu.log; exit 1; fi
          for i in $(seq 1 180); do
            if timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -qx 1; then break; fi
            sleep 2
          done
          if ! timeout 5s adb shell getprop sys.boot_completed | tr -d '\r' | grep -qx 1; then tail -100 /tmp/emu.log; exit 1; fi
          adb shell input keyevent 82
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -n "$APK"; unzip -l "$APK" | grep 'lib/x86_64/'
          adb install "$APK"
          adb shell monkey -p io.chainbox.app -c android.intent.category.LAUNCHER 1
          sleep 20
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb shell cat /sdcard/window.xml
          echo '--- activity task evidence ---'
          adb shell dumpsys activity recents | grep -C 5 -i 'io.chainbox.app' || true
          echo '--- errors ---'
          adb logcat -d -s AndroidRuntime:E ActivityManager:E | tail -100

      - name: Verify production UI import, public-host update and persistence
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          python3 scripts/wabi_socks_peer.py >wabi-evidence/ui-socks.log 2>&1 &
          socks=$!
          trap 'kill "$socks" 2>/dev/null || true' EXIT
          export WABI_HTTPS_BASE="https://raw.githubusercontent.com"
          python3 scripts/wabi_ui_persistence_android.py
      - name: Save emulator state
        if: always()
        working-directory: sing-box-for-android
        run: |
          mkdir -p wabi-evidence
          timeout 15s adb logcat -d > wabi-evidence/logcat.txt || true
          timeout 15s adb shell dumpsys jobscheduler > wabi-evidence/jobscheduler.txt || true
          timeout 15s adb exec-out screencap -p > wabi-evidence/final.png || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-persistence-acceptance
          path: |
            sing-box-for-android/wabi-evidence/
            sing-box-for-android/app/build/test-results/
          retention-days: 7
      - name: Preserve reusable test APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-persistence-debug-apk
          path: sing-box-for-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
