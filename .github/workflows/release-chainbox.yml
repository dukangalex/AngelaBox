name: AngelaBox Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (e.g. v1.0.53)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout AngelaBox app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: sing-box-for-android

      - name: Read kernel pin
        id: pin
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          COMMIT=$(grep '^KERNEL_COMMIT=' version.properties | cut -d= -f2 | tr -d '\r')
          echo "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout Chain kernel at audited commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dukangalex/sing-box
          ref: 03ad0a1d7c659e863c7100d25fa74681b5465a34
          path: sing-box
          fetch-depth: 1

      - name: Record kernel identity
        working-directory: sing-box
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "03ad0a1d7c659e863c7100d25fa74681b5465a34"
          test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify official types in audited kernel
        run: |
          set -euo pipefail
          UPSTREAM=$(grep '^KERNEL_UPSTREAM=' sing-box-for-android/version.properties | cut -d= -f2 | tr -d '\r')
          git clone --depth 1 --branch "v${UPSTREAM}" https://github.com/SagerNet/sing-box.git sing-box-official
          python3 sing-box-for-android/scripts/check_upstream_features.py --official sing-box-official --fork sing-box

      - name: Setup Java 17 and 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.5"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK components
        run: |
          set -e
          yes | sdkmanager --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --install "ndk;28.0.13004108" "platforms;android-37.1" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Test Chain kernel
        working-directory: sing-box
        run: |
          set -euo pipefail
          packages=$(go list ./... | grep -v '^github.com/sagernet/sing-box/experimental/boxdd$' | grep -v '^github.com/sagernet/sing-box/experimental/libbox$')
          sudo -E env -u GITHUB_TOKEN -u GH_TOKEN go test $packages
          sudo chown -R "$(id -u):$(id -g)" "$(go env GOPATH)" "$(go env GOCACHE)" "$(go env GOMODCACHE)"

      - name: Install gomobile
        run: |
          set -euo pipefail
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" version || "$(go env GOPATH)/bin/gomobile" init || true

      - name: Build libbox AAR
        working-directory: sing-box
        run: |
          set -e
          export JAVA_HOME="${JAVA_HOME_17_X64:?JAVA_HOME_17_X64 not set}"
          export PATH="$JAVA_HOME/bin:$(go env GOPATH)/bin:$PATH"
          java --version
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p ../sing-box-for-android/app/libs
          cp -f libbox.aar ../sing-box-for-android/app/libs/libbox.aar
          if [ -f libbox-legacy.aar ]; then cp -f libbox-legacy.aar ../sing-box-for-android/app/libs/; else cp -f libbox.aar ../sing-box-for-android/app/libs/libbox-legacy.aar; fi

      - name: Configure release signing
        working-directory: sing-box-for-android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          STORE_PASS="${KEYSTORE_PASS:-$KEYSTORE_PASSWORD}"
          ALIAS="${ALIAS_NAME:-$KEY_ALIAS}"
          KEY_PASS="${ALIAS_PASS:-$KEY_PASSWORD}"
          test -n "$STORE_PASS" && test -n "$ALIAS" && test -n "$KEY_PASS"
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          {
            echo "KEYSTORE_PASS=$STORE_PASS"
            echo "ALIAS_NAME=$ALIAS"
            echo "ALIAS_PASS=$KEY_PASS"
          } >> local.properties
          CERT_SHA256=$(keytool -list -v -keystore app/release.keystore -storepass "$STORE_PASS" -alias "$ALIAS" -keypass "$KEY_PASS" | awk -F': ' '/^[[:space:]]*SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "$CERT_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test "$CERT_SHA256" = "e7041217f276a7cd860b2e210f6f7d91590f263730e09fbf73bae929d6994151"
          echo "RELEASE_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleOtherRelease --no-daemon --stacktrace

      - name: Verify release APK signing and checksum
        working-directory: sing-box-for-android
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | grep -v debug | head -n1)"
          test -n "$APK"
          APKSIGNER="${ANDROID_HOME}/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          SIGNING_INFO=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)
          printf '%s\n' "$SIGNING_INFO"
          CERT_SHA256=$(printf '%s\n' "$SIGNING_INFO" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "$CERT_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          test "$CERT_SHA256" = "$RELEASE_CERT_SHA256"
          test "$CERT_SHA256" = "e7041217f276a7cd860b2e210f6f7d91590f263730e09fbf73bae929d6994151"
          "$APKSIGNER" verify "$APK"
          python3 scripts/verify_apk_signature.py --require-release "$APK"
          cp -f "$APK" AngelaBox-android.apk
          sha256sum AngelaBox-android.apk > AngelaBox-android.apk.sha256
          test -s AngelaBox-android.apk.sha256
          sha256sum -c AngelaBox-android.apk.sha256
          grep -q 'AngelaBox-android.apk' AngelaBox-android.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.version_tag }}
          name: AngelaBox ${{ inputs.version_tag }}
          body: |
            更新说明
            • 仪表覆写提示缩短：脚本显示「xxx覆写 / 脚本启用中」，配置规范化显示「配置规范化 / 启用中」。
            • 分应用代理：新增「非中国应用」扫描；中国/海外判定改为包名、安装来源和名称，不再扫 APK 内部 SDK（减少误判）。隐藏离线、隐藏已停用默认开启。
            • 订阅、脚本、更新、WebDAV 仅允许 HTTPS。局域网 HTTP 订阅也会被拒绝。
            • 官方 1.14.1 仅为修补且把 Go 升到 1.26.8，本版内核仍钉 1.14.0。
            • 注重隐私、安全防护、高能低耗、开箱即用。

            Install `AngelaBox-android.apk` (arm64). That is the only file you need.

            Verify:

            ```
            sha256sum -c AngelaBox-android.apk.sha256
            ```

            - Product: AngelaBox
            - Package: `io.chainbox.app`
            - Kernel branch: `chain-dev`
            - Kernel tag: `v1.12.0-chain.4`
            - Kernel commit: `03ad0a1d7c659e863c7100d25fa74681b5465a34`
            - Official baseline: SagerNet/sing-box `v1.14.0`
            - Official type-constant check: `pass`
          files: |
            sing-box-for-android/AngelaBox-android.apk
            sing-box-for-android/AngelaBox-android.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
